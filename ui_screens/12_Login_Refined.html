<style>
        body {
            background-color: #0b1326;
            color: #dae2fd;
            font-family: 'Geist', sans-serif;
            overflow-x: hidden;
        }
        .glass-card {
            background: #171f33;
            border: 1px solid #454653;
            box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.4);
        }
        .ai-glow {
            box-shadow: 0 0 40px -10px rgba(129, 140, 248, 0.1);
        }
        .mesh-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.5;
            background: radial-gradient(circle at 15% 20%, #171f33 0%, transparent 45%),
                        radial-gradient(circle at 85% 80%, #0b1326 0%, transparent 45%);
        }
    </style>

<body class="flex items-center justify-center min-h-screen p-8">
<!-- Atmospheric Background Shader -->
<div class="mesh-bg"></div>
<!-- Main Content Container -->
<main class="w-full max-w-[440px] relative z-10">
<!-- Header / Logo -->
<div class="text-center mb-10">
<div class="inline-flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-[36px]">bubble_chart</span>
<h1 class="font-headline-lg text-headline-lg tracking-tight text-on-surface">LeadForge AI</h1>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">Accelerate your enterprise intelligence.</p>
</div>
<!-- Login Card -->
<div class="glass-card ai-glow rounded-xl p-10 flex flex-col gap-8">
<div class="flex flex-col gap-1">
<h2 class="font-headline-md text-headline-md text-on-surface">Welcome back</h2>
<p class="font-body-md text-body-md text-outline">Please enter your details to sign in.</p>
</div>
<!-- Social Login -->
<button class="w-full h-12 flex items-center justify-center gap-3 bg-surface-container-high hover:bg-surface-container-highest transition-all border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface group">
<svg class="group-hover:scale-110 transition-transform" height="18" viewBox="0 0 18 18" width="18">
<path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"></path>
<path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"></path>
<path d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"></path>
<path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.443 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z" fill="#EA4335"></path>
</svg>
                Sign in with Google
            </button>
<div class="flex items-center gap-4">
<div class="h-px bg-outline-variant flex-1 opacity-50"></div>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-widest">or continue with email</span>
<div class="h-px bg-outline-variant flex-1 opacity-50"></div>
</div>
<!-- Form -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase">Email Address</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 font-body-md text-on-surface focus:ring-2 focus:ring-primary/40 focus:border-primary outline-none transition-all placeholder:text-outline/50" placeholder="name@company.com" type="email">
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase">Password</label>
<a class="font-body-md text-body-md text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-3 font-body-md text-on-surface focus:ring-2 focus:ring-primary/40 focus:border-primary outline-none transition-all placeholder:text-outline/50" placeholder="••••••••" type="password">
</div>
<button class="w-full h-12 mt-2 bg-primary hover:bg-primary-container text-on-primary font-label-sm text-label-sm rounded-lg transition-all active:scale-[0.98] duration-150 flex items-center justify-center gap-2 shadow-lg shadow-primary/20">
                    SIGN IN TO FORGE
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer Actions -->
<p class="text-center mt-10 font-body-md text-body-md text-outline">
            Don't have an account? 
            <a class="text-primary font-semibold hover:text-primary-container transition-colors" href="#">Sign up for a free trial</a>
</p>
<!-- Dynamic Micro-interactions script -->
<script>
            document.addEventListener('DOMContentLoaded', () => {
                const inputs = document.querySelectorAll('input');
                inputs.forEach(input => {
                    input.addEventListener('focus', () => {
                        input.parentElement.querySelector('label').classList.add('text-primary');
                        input.parentElement.querySelector('label').classList.remove('text-on-surface-variant');
                    });
                    input.addEventListener('blur', () => {
                        input.parentElement.querySelector('label').classList.remove('text-primary');
                        input.parentElement.querySelector('label').classList.add('text-on-surface-variant');
                    });
                });
            });
        </script>
</main>
<!-- Decorative Illustration (Bento Style Floating Detail) -->
<div class="hidden lg:block absolute right-16 top-1/2 -translate-y-1/2 w-72 h-auto overflow-hidden pointer-events-none">

</div>
<div class="flex flex-col gap-3">
<div class="h-2 w-3/4 bg-primary/20 rounded"></div>
<div class="h-2 w-1/2 bg-outline/30 rounded"></div>
<div class="h-2 w-2/3 bg-outline/30 rounded"></div>
</div>
<div class="mt-4 flex justify-between items-center">
<div class="h-10 w-10 rounded-full bg-primary/10"></div>
<div class="h-4 w-20 bg-outline/30 rounded"></div>
</div>
</div>
</div>
</body></html>
